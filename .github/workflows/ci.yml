# PR 檢查。做的事就是 `scripts/tpass check`（lint + tsc）再加上 build，
# 只是換一個地方跑：換成一台什麼都沒有的全新機器。
#
# 為什麼要有這個：main 沒有任何守門員，而組織裡有四個帳號推得動它。
# 部員交 v1、由部長與 Ray 接手驗收與維護——這條 workflow 是給接手的人用的：
# 不必把別人交來的 code clone 下來，就先知道它 lint / 型別 / build 過不過。
#
# ⚠️ 這個檔案是自給自足的樣板。要給第八個服務加 CI，整份複製過去，
#    只改下面 env: 區塊裡的值（＋沒有 Prisma / 沒有測試就刪掉對應那一行）。
name: ci

on:
  # PR 一開、每次再推 commit 都跑。
  pull_request:
  # 目前沒有開分支保護，直推 main 是常態——所以 main 這條不是保險絲而是主力：
  # 推壞的人 40 秒後會收到 GitHub 的失敗信，commit 列表上掛一個紅叉。
  push:
    branches: [main]

# 同一個 PR / 分支連推三次，前兩次直接取消，只留最新那次。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小權限：只讀自己的原始碼。預設是讀寫，明寫成唯讀＝workflow 被改壞也偷不走東西。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # build 期間會 import src/config/*.ts，那裡的 REQUIRED 檢查缺 env 就直接 throw。
    # 所以 CI 需要一份「形狀正確但完全是假的」env。
    #
    # 🔒 這裡永遠不放真值。repo 是 public，這個檔案任何人都看得到；
    # CI 不連任何真實資料庫、不打真的 auth——它只是編譯。
    # 網域一律用 .invalid（RFC 2606 保證這個 TLD 永遠解析不出來）：
    # 萬一有人寫出「build 時就去 fetch」的 code，它會當場爆炸，而不是安靜地打到正式站。
    env:
      AUTH_JWKS_URL: https://ci.invalid/.well-known/jwks.json
      AUTH_AUTHORIZE_URL: https://ci.invalid/api/auth/authorize
      AUTH_LOGOUT_URL: https://ci.invalid/api/auth/logout
      VOTE_SELF_URL: https://ci.invalid
      PORTAL_URL: https://ci.invalid
      TPASS_SERVICE_ID: vote
      JWT_ISSUER: https://ci.invalid
      # Prisma 7 的 prisma.config.ts 在載入時就解析 env("DATABASE_URL")，缺了連 prisma generate
      # （postinstall 會跑）都起不來。CI 不會真的連線，給個形狀正確的假值就好。
      DATABASE_URL: postgresql://ci:ci@ci.invalid:5432/ci

    steps:
      # action 版本釘在現行大版本。GitHub 會把 node20 時代的 action 強制跑在 node24
      # 上並掛警告，一路釘最新就不會累積這種待爆的技術債。
      - uses: actions/checkout@v7

      # 順序有意義：pnpm 要先裝好，下一步的 cache: pnpm 才找得到它來算快取路徑。
      # 版本不寫在這裡——action 會讀 package.json 的 packageManager 欄位，
      # 跟本機、主機是同一個真相來源。
      - uses: pnpm/action-setup@v6

      # 22 是刻意的：主機跑的就是 node v22。CI 綠了但主機炸掉是最沒有價值的綠燈。
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      # --frozen-lockfile：鎖檔跟 package.json 對不上就直接失敗，不會自作主張改鎖檔。
      # CI 要重現的是「這個 commit 當時的依賴」，不是「今天裝起來會變成什麼」。
      # deploy.sh 上線時用的也是同一個旗標。
      - run: pnpm install --frozen-lockfile

      # Prisma client 是生成物，不進 git，也沒有 postinstall 會帶到
      # （deploy.sh 有同樣的註解與同樣的順序）。少這一步，tsc 拿不到 model 型別。
      - run: pnpm exec prisma generate

      # Next 16 把 route 的型別（RouteContext…）生成在 .next/types/ 底下。
      # 全新 clone 沒有 .next，所以 tsc 會噴 Cannot find name 'RouteContext'——
      # 本機不會發生，因為你的 .next 一直都在。typegen 只生型別，不做完整 build。
      - run: pnpm exec next typegen

      # 由快到慢排：lint 幾秒、tsc 十幾秒、build 最久。錯越早出現，等紅燈的時間越短。
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm run build

  # 補查核：9/2 事故（見 docs/handbook 資料庫準則）的教訓是 migration 只在寫的人本機
  # 跑過一次，沒人驗過「對一個全新空庫」是否真的套得起來；deploy.sh 也會因為服務缺
  # ecosystem.config.js 直接拒絕部署，但這件事從沒進過 CI，永遠是部署當下才發現。
  # 這兩件事跟上面的 check job 無關（不需要 lint/tsc/build），獨立一個 job 平行跑。
  migrate-and-process-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # 全新的、什麼資料都沒有的 postgres——這裡要驗的正是「空庫」這個狀態。
    # 只在 CI runner 內部的 localhost 起這個容器，不是任何真實主機，log 裡不會出現主機位址。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate

      # 真的對上面那個空庫套用 prisma/migrations 底下全部 migration。套不起來
      # （壞掉的 migration、SQL 語法錯、migration 之間互相衝突）在這裡就會炸，
      # 不必等部署當下才發現。
      # ⚠️ 這裡驗的只是「這批 migration 能不能套進一個空庫」，不是「migrations
      # 有沒有跟目前的 prisma/schema.prisma 同步」——migrate deploy 不讀 datamodel，
      # schema 改了但忘記 `prisma migrate dev` 產生對應 migration 的那種分岔
      # （9/2 事故那類）這一步照樣是綠燈，抓不到。
      - run: pnpm exec prisma migrate deploy

      # pm2 要吃這個檔案才知道怎麼啟動、怎麼收 SIGTERM；deploy.sh 沒看到它會直接拒絕部署。
      # 這一步只在檔案真的缺席時才會紅——如果這裡紅了，代表現在 checkout 到的這個
      # commit 真的沒辦法部署，不是這個查核本身壞了。
      - run: test -f ecosystem.config.js
